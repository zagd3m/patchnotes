# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.
#
# If you need help with YAML syntax, here are some quick references for you:
# https://learn-the-web.algonquindesign.ca/topics/markdown-yaml-cheat-sheet/#yaml
# https://learnxinyminutes.com/docs/yaml/
#
# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

title: Zagd3m PD2 imaginary patch notes
description: >-
  Unofficial futuristic patch notes and build guides for Project Diablo 2 —
  proposals for more build diversity, QoL, and balance.
author: zagd3m
logo: /assets/img/banner.png
# baseurl: "/docs" # the subpath of your site, e.g. /blog
github_username:  zagd3m

# User defined
domain: zagd3m.github.io
url: https://zagd3m.github.io
baseurl: /patchnotes
permalink: /blog/:title/

# Github not modifiable
lsi: false
safe: true
incremental: false
highlighter: rouge
gist:
  noscript: false

# Collections
collections:
  patchnotes:
    output: true
    permalink: /:name/
  builds:
    output: true
    permalink: /builds/:name/

kramdown:
  math_engine: mathjax
  syntax_highlighter: rouge
  toc_levels: 1..2

# Build settings
encoding: UTF-8
theme: jekyll-theme-minimal
plugins:
  - jekyll-feed
  - jekyll-titles-from-headings
  - jekyll-relative-links
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-redirect-from

defaults:
  - scope:
      path: ""
    values:
      image: /assets/img/banner.png
  - scope:
      path: ""
      type: "builds"
    values:
      layout: "build"
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

sass:
  sass_dir: _sass
  style: compressed

titles_from_headings:
  enabled:     true
  strip_title: false
  collections: false

relative_links:
  enabled:     true
  collections: false

# WARNING: `exclude:` REPLACES Jekyll's default exclude list, it does not
# merge. The defaults below must be re-listed or CI builds with vendored
# gems (vendor/bundle) will try to parse gem files as posts and fail.
#
# Why AGENTS.md is listed: GitHub Pages force-enables
# jekyll-optional-front-matter and jekyll-default-layout, so ANY Markdown file
# without front matter in this folder gets published twice — raw at /NAME.md
# and rendered at /NAME/. Exclude agent-facing docs here, or they leak.
exclude:
  # Jekyll defaults — required, do not remove
  - .sass-cache/
  - .jekyll-cache/
  - .jekyll-metadata
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  # Project additions
  - AGENTS.md
